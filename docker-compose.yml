version: '3.8'

services:
  # MySQL 数据库服务
  mysql:
    image: mysql:8.4-alpine
    container_name: exam-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-exam_db}
      MYSQL_USER: ${MYSQL_USER:-examuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-exampass123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./add_drawing_support.sql:/docker-entrypoint-initdb.d/02-drawing.sql
      - ./create_notifications.sql:/docker-entrypoint-initdb.d/03-notifications.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exam_network
    restart: unless-stopped

  # 应用服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exam-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-examuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-exampass123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-exam_db}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-key-min-32-characters-long}
      APP_URL: ${APP_URL:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EMAIL_SENDER: ${EMAIL_SENDER:-}
      EMAIL_AUTH_CODE: ${EMAIL_AUTH_CODE:-}
      VITE_API_PROXY_TARGET: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
      - ./exam.db:/app/exam.db
    networks:
      - exam_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 可选：Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: exam-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - exam_network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  exam_network:
    driver: bridge
